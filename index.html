<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack FCT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game-container">
        <div class="header">
            <h1>🎰 CASINO 🃏</h1>
        </div>

        <div class="table">
            <div class="hand-section">
                <div class="label">CRUPIER</div>
                <div id="dealer-cards" class="cards-display"></div>
                <div class="score-badge">Puntos: <span id="dealer-score">0</span></div>
            </div>

            <div id="result-overlay" class="hidden">
                <h2 id="result-text"></h2>
            </div>

            <div class="hand-section">
                <div class="label">TU MANO</div>
                <div id="player-cards" class="cards-display"></div>
                <div class="score-badge">Puntos: <span id="player-score">0</span></div>
            </div>
        </div>

        <div class="controls">
            <div id="game-btns">
                <button id="hit-btn" class="btn hit">PEDIR</button>
                <button id="stand-btn" class="btn stand">PLANTARSE</button>
            </div>
            <div id="end-btns" class="hidden">
                <button id="rematch-btn" class="btn rematch">VOLVER A JUGAR</button>
                <button id="exit-btn" class="btn exit">SALIR</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
