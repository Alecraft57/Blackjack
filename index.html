<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack Pro - Telegram</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
    <div id="game">
        <h1>🃏 BLACKJACK 🃏</h1>
        
        <div class="board">
            <div class="section">
                <h3>Crupier</h3>
                <div id="dealer-cards" class="cards-row"></div>
                <p>Puntos: <span id="dealer-score">0</span></p>
            </div>

            <div class="section">
                <h3>Tu Mano</h3>
                <div id="player-cards" class="cards-row"></div>
                <p>Puntos: <span id="player-score">0</span></p>
            </div>
        </div>

        <p id="message"></p>

        <div class="controls">
            <button id="hit-btn" class="btn">Pedir Carta</button>
            <button id="stand-btn" class="btn">Plantarse</button>
            <button id="reset-btn" class="btn hidden">Nueva Mano</button>
            <button id="exit-btn" class="btn exit">Salir</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
